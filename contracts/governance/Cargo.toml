[package]
name = "governance"
version = "0.1.0"
edition = "2021"
description = "NEAR governance contract for Citizens House voting"
repository = "https://github.com/HackHumanityOrg/near-citizens-house"

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.19.0-rust-1.86.0"
image_digest = "sha256:772638e343baeeea24e49062c7d424274f3441452cc06ce97fc4e5695b19fecc"
passed_env = []
container_build_command = [
  "cargo",
  "near",
  "build",
  "non-reproducible-wasm",
  "--locked",
]

[features]
default = []
integration-tests = []
testing = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.24"
borsh = "1.6"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
near-sdk = { version = "5.24", features = ["unit-testing"] }
near-workspaces = "0.21"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
tokio = { version = "1.49", features = ["full"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

perf = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[profile.release.package."*"]
codegen-units = 1
opt-level = "z"
